name: Data

# One pipeline for the dataset:
#   pull requests  -> validate only (schemas, cross-links, sanity checks)
#   push to main   -> validate, regenerate data/ballots + the SQLite database, publish
#   daily / manual -> also re-import the official candidate lists first
on:
  pull_request:
    paths: ["data/**", "schema/**", "tools/**", "package.json", "package-lock.json", ".github/workflows/data.yml"]
  push:
    branches: [main]
    paths: ["data/elections/**", "data/research/**", "data/issues.json", "data/endorsers.json", "schema/**", "tools/**", "package.json", "package-lock.json", ".github/workflows/data.yml"]
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      states:
        description: "States to re-import (space separated, blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=moderate

      - name: Import official lists
        id: import
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true # a failed source keeps its last good data; we still build, then fail at the end
        env:
          STATES: ${{ inputs.states }}
        run: |
          [[ "$STATES" =~ ^[A-Za-z\ ]*$ ]] || { echo "states must be letters and spaces"; exit 1; }
          node tools/import/run.mjs $STATES

      - name: Validate
        if: github.event_name == 'pull_request'
        run: npm run check

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Commit data changes
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git add data/elections data/ballots
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "ballot-buddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ballot data ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish database
        if: github.event_name != 'pull_request' && (steps.commit.outputs.changed == 'true' || github.event_name != 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) Release asset: the download link people share.
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Ballot data (latest)" --notes "Building..." --latest=false
          gh release upload data-latest dist/ballot.sqlite --clobber
          gh release edit data-latest --notes-file dist/summary.md
          # 2) A one-commit branch, force-pushed each time, so browser tools
          #    (Datasette Lite) can read the file; release downloads block that.
          mkdir pub && cp dist/ballot.sqlite pub/
          printf '# Published data\n\nGenerated by .github/workflows/data.yml. Do not edit; this branch is overwritten on every publish.\n' > pub/README.md
          cd pub && git init -q -b data-dist && git add . \
            && git -c user.name="ballot-buddy-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publish ballot.sqlite" \
            && git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-dist

      - name: Keep copies of the official files
        if: steps.import.outcome != 'skipped' && hashFiles('dist/sources/*') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sources >/dev/null 2>&1 || gh release create sources --title "Official source files" --latest=false \
            --notes "Exact copies of the official candidate lists each import read, named by sha256. Referenced from data/elections/*/*/official/*/source.json."
          have=$(gh release view sources --json assets --jq '.assets[].name')
          for f in dist/sources/*; do
            grep -qx "$(basename "$f")" <<<"$have" || gh release upload sources "$f"
          done

      - name: Fail if an import failed
        if: steps.import.outcome == 'failure'
        run: |
          echo "::error::One or more official sources failed to import. Their last good data was kept; see the Import step."
          exit 1

name: Import official ballot data

on:
  push:
    branches: [import-pipeline] # temporary: lets the branch test itself
  workflow_dispatch:
    inputs:
      states:
        description: "States to import (space separated, blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 10 * * *" # daily; only commits when an official list changed

permissions:
  contents: write

concurrency:
  group: import-ballots
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=moderate
      - name: Import
        run: node tools/import/run.mjs ${{ github.event.inputs.states }}
      - name: Validate
        run: node tools/import/check.mjs
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data/ballots)" ]; then echo "No changes."; exit 0; fi
          git config user.name "ballot-buddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ballots
          git commit -m "Refresh official ballot data ($(date -u +%Y-%m-%d))"
          git push
